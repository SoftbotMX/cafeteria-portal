[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
description = "Portal de tutores - cafeteria escolar (Softbot)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.156,<1",
  "uvicorn[standard]>=0.54,<1",
  "jinja2>=3.1.6,<4",
  "sqlalchemy>=2.1.5,<3",
  "psycopg[binary]>=3.3.6,<4",
  "alembic>=1.20,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50.0.2,<51",
  "httpx>=0.28.1,<1",
  "python-multipart>=0.0.32,<1",
  "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = ["plantillas/**/*", "estatico/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
