{% extends "base.html" %}
{% block titulo %}Recuperar contraseña · Portal de tutores{% endblock %}
{% block contenido %}
<h1>Recuperar contraseña</h1>
<p>Escribe tu teléfono o correo. {{ mensaje }}.</p>
{% if error %}<p class="aviso" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/recuperar">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Teléfono o correo
    <input name="usuario" value="{{ usuario }}" autocomplete="username" required autofocus>
  </label>
  <button type="submit">Mandar código</button>
</form>
<p><a href="/entrar">Volver a entrar</a></p>
{% endblock %}
