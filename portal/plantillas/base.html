<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal de tutores{% endblock %}</title>
  <link rel="stylesheet" href="/estatico/portal.css">
  <script src="/estatico/htmx.min.js"></script>
</head>
<body>
  <main>
    {% if mensajes %}
      {% for m in mensajes %}<p class="aviso">{{ m }}</p>{% endfor %}
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
