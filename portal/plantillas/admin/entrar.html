{% extends "base.html" %}
{% block titulo %}Administración · Entrar{% endblock %}
{% block contenido %}
<h1>Administración</h1>
{% if error %}<p class="aviso" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/entrar">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Usuario
    <input name="usuario" value="{{ usuario }}" autocomplete="username" required autofocus>
  </label>
  <label>Contraseña
    <input type="password" name="contrasena" autocomplete="current-password" required>
  </label>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
