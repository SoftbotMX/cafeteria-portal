{% extends "base.html" %}
{% block titulo %}Código de recuperación · Portal de tutores{% endblock %}
{% block contenido %}
<h1>Escribe tu código</h1>
<p>{{ mensaje }}. El código vence en 15 minutos.</p>
{% if error %}<p class="aviso" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/recuperar/codigo">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Teléfono o correo
    <input name="usuario" value="{{ usuario }}" autocomplete="username" required>
  </label>
  <label>Código de 6 dígitos
    <input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus>
  </label>
  <label>Contraseña nueva (mínimo 8 caracteres)
    <input type="password" name="nueva" autocomplete="new-password" minlength="8" required>
  </label>
  <label>Repite la contraseña nueva
    <input type="password" name="confirmar" autocomplete="new-password" minlength="8" required>
  </label>
  <button type="submit">Cambiar contraseña</button>
</form>
<p><a href="/recuperar">Pedir otro código</a></p>
{% endblock %}
