# Producción en el VPS: `docker compose -p cafeteria-portal up -d --build` desde deploy/.
# Variables en deploy/.env (no se versiona): ver deploy/env.example.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env}
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      retries: 10

  portal:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${DB_PASSWORD}@db:5432/portal
    depends_on:
      db:
        condition: service_healthy
    # Sólo para nginx del host: nunca expuesto directo (ver Dockerfile).
    ports:
      - "127.0.0.1:8110:8000"

  # Recargas: reintenta las pagadas que el TPV no tomó y busca pagos sin aviso (cada minuto).
  barrido:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${DB_PASSWORD}@db:5432/portal
    depends_on:
      portal:
        condition: service_started
    command: ["python", "-m", "portal.barrido"]

volumes:
  portal_db:
