# /etc/nginx/sites-available/cafeteria.softbot.com.mx.conf
# Sólo HTTP: certbot --nginx agrega el 443 y la redirección.
server {
    listen 80;
    server_name cafeteria.softbot.com.mx;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        # El operador se resuelve por Host.
        proxy_set_header Host $host;
        # SOBRESCRIBE, no agrega ($proxy_add_x_forwarded_for): uvicorn confía en el primer
        # valor, y uno que mandara el papá le daría una IP nueva por intento (límites por IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
